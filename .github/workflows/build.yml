name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: ساخت APK (Debug)
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: ذخیره لاگ Build در صورت خطا
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: بارگذاری APK به‌عنوان خروجی قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
